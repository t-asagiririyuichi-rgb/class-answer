<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>回答送信</title>
<style>
body{
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f2f2f2;
}
.container{
width:90%;
max-width:420px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
input,textarea{
width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
box-sizing:border-box;
}
button{
width:100%;
padding:15px;
font-size:18px;
margin-top:15px;
background:#2a7cff;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}
/* 送信完了画面 */
#complete{
display:none;
text-align:center;
}
#complete .checkmark{
font-size:72px;
}
#complete h2{
color:#2a7cff;
margin-top:10px;
}
#complete p{
color:#555;
margin-top:10px;
}
</style>
</head>
<body>
<div class="container">

  <!-- 入力フォーム -->
  <div id="form-area">
    <h2>回答入力</h2>
    <input id="name" placeholder="名前">
    <textarea id="answer" rows="5" placeholder="回答を書く"></textarea>
    <button onclick="send()">送信</button>
  </div>

  <!-- 送信完了画面 -->
  <div id="complete">
    <div class="checkmark">✅</div>
    <h2>送信完了！</h2>
    <p>回答を受け付けました。</p>
  </div>

</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwZp3lvaxR5qqlB8jRBb3xuHvi1a-ZwYZ0MX4WcOZp7zUIV8qsG3Nh5KQjUSgdv-VIG/exec";
function send(){
  const data={
    name:document.getElementById("name").value,
    answer:document.getElementById("answer").value
  };
  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(res=>res.text())
  .then(()=>{
    // フォームを隠して完了画面を表示
    document.getElementById("form-area").style.display="none";
    document.getElementById("complete").style.display="block";
  });
}
</script>
</body>
</html>

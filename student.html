<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>回答送信</title>

<style>

body{
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f2f2f2;
}

.container{
width:90%;
max-width:420px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
font-size:18px;
margin-top:15px;
background:#2a7cff;
color:white;
border:none;
border-radius:6px;
}

#msg{
margin-top:10px;
color:green;
}

</style>
</head>

<body>

<div class="container">

<h2>回答入力</h2>

<input id="number" placeholder="出席番号">

<input id="name" placeholder="名前">

<textarea id="answer" rows="5" placeholder="回答を書く"></textarea>

<button onclick="send()">送信</button>

<div id="msg"></div>

</div>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwZp3lvaxR5qqlB8jRBb3xuHvi1a-ZwYZ0MX4WcOZp7zUIV8qsG3Nh5KQjUSgdv-VIG/exec";

function send(){

const data={
number:document.getElementById("number").value,
name:document.getElementById("name").value,
answer:document.getElementById("answer").value
};

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(data)
})
.then(res=>res.text())
.then(()=>{

document.getElementById("msg").innerText="送信しました";

document.getElementById("answer").value="";

});

}

</script>

</body>
</html>
